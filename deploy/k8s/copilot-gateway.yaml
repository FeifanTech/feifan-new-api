apiVersion: v1
kind: Namespace
metadata:
  name: new-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: new-api-config
  namespace: new-api
data:
  TZ: UTC
  LOG_LEVEL: info
  COPILOT_EDITOR_VERSION: vscode/1.104.3
  RATE_LIMIT_SEAT_CONCURRENT: "3"
  RATE_LIMIT_SEAT_QPM: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: new-api-secret
  namespace: new-api
type: Opaque
stringData:
  SQL_DSN: ""
  REDIS_CONN_STRING: ""
  SESSION_SECRET: ""
  CRYPTO_SECRET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: new-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: new-api
  template:
    metadata:
      labels:
        app: new-api
    spec:
      containers:
        - name: new-api
          image: ghcr.io/quantumnous/new-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: new-api-config
            - secretRef:
                name: new-api-secret
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/status
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: new-api
  namespace: new-api
spec:
  selector:
    app: new-api
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
