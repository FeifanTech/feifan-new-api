name: copilot-gateway-ci

on:
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - ".github/workflows/copilot-gateway-ci.yml"
  push:
    branches: ["main", "master"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "web/**"
      - ".github/workflows/copilot-gateway-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend deps
        run: |
          cd web
          bun install --frozen-lockfile

      - name: Build frontend
        run: |
          cd web
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$(cat ../VERSION) bun run build
